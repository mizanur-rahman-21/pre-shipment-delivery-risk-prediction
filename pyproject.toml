[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery_risk"
version = "1.0.0"
description = "Leakage-Controlled Pre-Shipment Delivery-Risk Prediction Package"
authors = [
    { name = "Mizanur Rahman", email = "mizanur.research@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "shap>=0.41.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0"
]

[tool.setuptools.packages.find]
where = ["src"]
